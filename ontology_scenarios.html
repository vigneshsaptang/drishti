<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Auracle v3 Risk Ontology — Scoring Scenarios</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --surface2:  #1c2128;
    --border:    #30363d;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --accent:    #58a6ff;
    --accent2:   #3fb950;
    --warn:      #d29922;
    --danger:    #f85149;
    --critical:  #ff7b72;
    --pill-bg:   #21262d;

    --c-clean:      #3fb950;
    --c-breach:     #58a6ff;
    --c-criminal:   #f85149;
    --c-fraud:      #d29922;
    --c-litigation: #bc8cff;
    --c-matrimonial:#ff9800;
    --c-underground: #a371f7;
    --c-sanctioned: #ff6e6e;
    --c-rehab:      #4fc3f7;
    --c-shell:      #f0b429;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Header */
  .header {
    border-bottom: 1px solid var(--border);
    padding: 18px 32px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header-logo {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, #58a6ff 0%, #bc8cff 100%);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 800; color: #0d1117;
    letter-spacing: -1px;
    flex-shrink: 0;
  }
  .header-title { font-size: 18px; font-weight: 700; }
  .header-sub   { font-size: 12px; color: var(--muted); margin-top: 1px; }
  .header-badge {
    margin-left: auto;
    font-size: 11px;
    color: var(--muted);
    background: var(--pill-bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 3px 10px;
  }

  /* Layout */
  .layout {
    display: grid;
    grid-template-columns: 230px 1fr;
    min-height: calc(100vh - 65px);
  }

  /* Sidebar */
  .sidebar {
    border-right: 1px solid var(--border);
    padding: 24px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .sidebar-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .07em;
    padding: 0 8px;
    margin-bottom: 8px;
  }
  .scenario-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 12px;
    border-radius: 8px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    text-align: left;
    font-size: 13px;
    transition: background .15s, color .15s;
    width: 100%;
  }
  .scenario-btn:hover { background: var(--surface2); color: var(--text); }
  .scenario-btn.active {
    background: var(--surface2);
    color: var(--text);
    font-weight: 600;
  }
  .scenario-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .scenario-btn .risk-badge {
    margin-left: auto;
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }

  /* Main content */
  .main { padding: 28px 32px; overflow-y: auto; }

  .section-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 16px;
  }

  /* Scenario headline */
  .scenario-header {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    margin-bottom: 28px;
  }
  .scenario-color-bar {
    width: 4px;
    height: 56px;
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 3px;
  }
  .scenario-name  { font-size: 22px; font-weight: 700; }
  .scenario-desc  { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .scenario-stats {
    margin-left: auto;
    display: flex;
    gap: 16px;
    flex-shrink: 0;
  }
  .stat-box {
    text-align: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 16px;
    min-width: 80px;
  }
  .stat-val {
    font-size: 24px;
    font-weight: 800;
    line-height: 1;
    margin-bottom: 3px;
  }
  .stat-label { font-size: 11px; color: var(--muted); }

  /* Charts row */
  .charts-row {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
    margin-bottom: 28px;
  }
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
  }
  .chart-card-title {
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    margin-bottom: 16px;
  }
  .chart-wrap { position: relative; }
  .radar-wrap { height: 300px; }
  .bar-wrap   { height: 300px; }

  /* Domains grid */
  .domains-section { margin-bottom: 28px; }
  .domains-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
  }
  .domain-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
  }
  .domain-tile-name {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .domain-tile-val {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 4px;
  }
  .domain-bar {
    height: 4px;
    border-radius: 2px;
    background: var(--border);
    overflow: hidden;
  }
  .domain-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width .4s ease;
  }
  .level-LOW      { color: var(--accent2); }
  .level-MEDIUM   { color: var(--warn); }
  .level-HIGH     { color: var(--danger); }
  .level-CRITICAL { color: var(--critical); }

  /* Factor table */
  .factors-section {}
  .factors-table {
    width: 100%;
    border-collapse: collapse;
  }
  .factors-table th {
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .06em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .factors-table td {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
  }
  .factors-table tr:last-child td { border-bottom: none; }
  .factors-table tr:hover td { background: var(--surface2); }
  .factor-id-cell { font-family: monospace; font-size: 12px; color: var(--text); }
  .factor-kind-mit {
    font-size: 10px;
    font-weight: 600;
    color: var(--accent2);
    background: rgba(63,185,80,.12);
    border: 1px solid rgba(63,185,80,.25);
    border-radius: 4px;
    padding: 1px 6px;
    display: inline-block;
  }
  .factor-kind-adv {
    font-size: 10px;
    font-weight: 600;
    color: var(--danger);
    background: rgba(248,81,73,.10);
    border: 1px solid rgba(248,81,73,.22);
    border-radius: 4px;
    padding: 1px 6px;
    display: inline-block;
  }
  .sev-bar {
    display: flex; align-items: center; gap: 8px;
  }
  .sev-track {
    flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; max-width: 90px;
  }
  .sev-fill { height: 100%; border-radius: 3px; }
  .conf-pill {
    font-size: 11px; font-weight: 700;
    padding: 2px 7px; border-radius: 4px;
    background: var(--pill-bg);
    color: var(--text);
  }

  /* Domain contributions in factor table */
  .dom-contrib-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    max-width: 320px;
  }
  .dom-chip {
    font-size: 10px;
    font-family: monospace;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--pill-bg);
    color: var(--muted);
    white-space: nowrap;
  }
  .dom-chip.pos { color: var(--danger);  background: rgba(248,81,73,.10); }
  .dom-chip.neg { color: var(--accent2); background: rgba(63,185,80,.10); }

  /* Purpose bar */
  .purpose-table { width: 100%; border-collapse: collapse; }
  .purpose-table td { padding: 5px 0; font-size: 12px; }
  .purpose-name-cell { width: 210px; color: var(--text); white-space: nowrap; }
  .purpose-bar-cell  { padding: 0 10px; }
  .purpose-val-cell  { width: 40px; text-align: right; font-weight: 700; font-family: monospace; font-size: 12px; }
  .p-bar { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .p-bar-fill { height: 100%; border-radius: 3px; transition: width .4s; }

  /* Level badge (headline) */
  .level-badge {
    display: inline-flex; align-items: center;
    font-size: 12px; font-weight: 700;
    border-radius: 6px; padding: 3px 10px;
    margin-top: 5px;
  }
  .lbadge-LOW      { background: rgba(63,185,80,.15);  color: var(--accent2); }
  .lbadge-MEDIUM   { background: rgba(210,153,34,.15); color: var(--warn);    }
  .lbadge-HIGH     { background: rgba(248,81,73,.15);  color: var(--danger);  }
  .lbadge-CRITICAL { background: rgba(255,123,114,.2); color: var(--critical);}

  /* Responsive */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { border-right: none; border-bottom: 1px solid var(--border); flex-direction: row; flex-wrap: wrap; padding: 12px; }
    .charts-row { grid-template-columns: 1fr; }
    .domains-grid { grid-template-columns: repeat(2,1fr); }
    .scenario-stats { display: none; }
  }

  .divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 24px 0;
  }
</style>
</head>
<body>

</header>

<div class="layout">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="main" id="main"></main>

/* =============================================================
   SCORING ENGINE  — mirrors risk_scorer.py score() exactly
============================================================= */
function computeScore(factors, purposeKey) {
  const pw = PURPOSE_PROFILES[purposeKey] || PURPOSE_PROFILES["GeneralDueDiligence"];
  const domainRaw = {};
  DOMAINS.forEach(d => domainRaw[d] = 0.0);

  for (const f of factors) {
    const entry = FACTOR_CATALOG[f.factor_id];
    if (!entry) continue;
    const raw = entry.base_severity * f.confidence;
    for (const d of DOMAINS) {
      domainRaw[d] += raw * (entry.domain_weights[d] || 0);
    }
  }

  const domNorm = {};
  for (const d of DOMAINS) {
    domNorm[d] = Math.max(0.0, Math.min(10.0, domainRaw[d] / 25.0));
  }

  const totalWeight = DOMAINS.reduce((s, d) => s + (pw[d] || 0), 0) || 1.0;
  const rawComposite = DOMAINS.reduce((s, d) => s + domNorm[d] * (pw[d] || 0), 0) / totalWeight;
  const composite = Math.max(0.0, Math.min(10.0, rawComposite));

  return { domNorm, domainRaw, composite: Math.round(composite * 10) / 10 };
}

function level(v) {
  if (v >= 7.0) return "CRITICAL";
  if (v >= 4.5) return "HIGH";
  if (v >= 2.0) return "MEDIUM";
  return "LOW";
}

function levelColor(lv) {
  return { LOW: "#3fb950", MEDIUM: "#d29922", HIGH: "#f85149", CRITICAL: "#ff7b72" }[lv] || "#8b949e";
}

function domainBarColor(v) {
  if (v >= 7) return "#ff7b72";
  if (v >= 4.5) return "#f85149";
  if (v >= 2) return "#d29922";
  return "#3fb950";
}

function isMitigating(fid) {
  const entry = FACTOR_CATALOG[fid];
  if (!entry) return false;
  return Object.values(entry.domain_weights).some(w => w < 0);
}

/* =============================================================
   PRE-COMPUTE all composites per scenario x purpose
============================================================= */
const PRECOMPUTED = {};
for (const sc of SCENARIOS) {
  PRECOMPUTED[sc.id] = {};
  for (const pKey of Object.keys(PURPOSE_PROFILES)) {
    PRECOMPUTED[sc.id][pKey] = computeScore(sc.factors, pKey);
  }
}

    btn.innerHTML = `
      <span class="scenario-dot" style="background:${sc.color}"></span>
      <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${sc.name}</span>
      <span class="risk-badge" style="background:${levelColor(lv)}22;color:${levelColor(lv)};border:1px solid ${levelColor(lv)}44">${lv}</span>
    `;
    btn.addEventListener("click", () => {
      activeScenario = sc.id;
      document.querySelectorAll(".scenario-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      renderMain();
    });
    sb.appendChild(btn);
  }
}

/* =============================================================
   MAIN RENDER
============================================================= */
function renderMain() {
  const sc = SCENARIOS.find(s => s.id === activeScenario);
  const defaultResult = PRECOMPUTED[sc.id]["GeneralDueDiligence"];
  const composite = defaultResult.composite;
  const lv = level(composite);

  const adverseCount   = sc.factors.filter(f => !isMitigating(f.factor_id)).length;
  const mitigCount     = sc.factors.filter(f =>  isMitigating(f.factor_id)).length;

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="scenario-header">
      <div class="scenario-color-bar" style="background:${sc.color}"></div>
      <div>
        <div class="scenario-name">${sc.name}</div>
        <div class="scenario-desc">${sc.desc}</div>
        <div style="margin-top:6px">
          <span class="level-badge lbadge-${lv}">${lv}</span>
        </div>
      </div>
      <div class="scenario-stats">
        <div class="stat-box">
          <div class="stat-val" style="color:${levelColor(lv)}">${composite.toFixed(1)}</div>
          <div class="stat-label">Composite<br>(General DD)</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color:var(--danger)">${adverseCount}</div>
          <div class="stat-label">Adverse<br>Factors</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" style="color:var(--accent2)">${mitigCount}</div>
          <div class="stat-label">Mitigating<br>Factors</div>
        </div>
      </div>
    </div>

    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-card-title">Domain Profile — Spider (General DD)</div>
        <div class="chart-wrap radar-wrap"><canvas id="radarCanvas"></canvas></div>
      </div>
      <div class="chart-card">
        <div class="chart-card-title">Composite Score Across All 14 Purpose Profiles</div>
        <div class="chart-wrap bar-wrap"><canvas id="barCanvas"></canvas></div>
      </div>
    </div>

    <hr class="divider" />

    <div class="domains-section">
      <div class="section-title">Domain Scores — General Due Diligence weights</div>
      <div class="domains-grid" id="domainsGrid"></div>
    </div>

    <hr class="divider" />

    <div class="factors-section">
      <div class="section-title">Active Factors — ${sc.factors.length} total</div>
      <div class="chart-card" style="padding:0;overflow:hidden">
        <table class="factors-table">
          <thead>
            <tr>
              <th>Factor ID</th>
              <th>Type</th>
              <th>Base Sev</th>
              <th>Conf</th>
              <th>Raw Score</th>
              <th>Top Domain Contributions</th>
            </tr>
          </thead>
          <tbody id="factorsTbody"></tbody>
        </table>
      </div>
    </div>

    <hr class="divider" />

    <div>
      <div class="section-title">Composite Scores by Purpose Profile — sorted by score</div>
      <div class="chart-card">
        <table class="purpose-table" id="purposeTable"></table>
      </div>
    </div>
  `;

  buildDomainTiles(defaultResult);
  buildFactorsTable(sc);
  buildPurposeTable(sc);
  buildRadarChart(sc, defaultResult);
  buildBarChart(sc);
}

function buildDomainTiles(result) {
  const grid = document.getElementById("domainsGrid");
  for (const d of DOMAINS) {
    const v = result.domNorm[d];
    const lv = level(v);
    const col = domainBarColor(v);
    const tile = document.createElement("div");
    tile.className = "domain-tile";
    tile.innerHTML = `
      <div class="domain-tile-name">${DOMAIN_LABELS[d]}</div>
      <div class="domain-tile-val level-${lv}">${v.toFixed(2)}</div>
      <div class="domain-bar"><div class="domain-bar-fill" style="width:${v*10}%;background:${col}"></div></div>
    `;
    grid.appendChild(tile);
  }
}

function buildFactorsTable(sc) {
  const tbody = document.getElementById("factorsTbody");
  for (const f of sc.factors) {
    const entry = FACTOR_CATALOG[f.factor_id];
    if (!entry) continue;
    const mit = isMitigating(f.factor_id);
    const rawScore = entry.base_severity * f.confidence;
    const sevPct = (entry.base_severity / 10) * 100;
    const sevColor = entry.base_severity >= 8 ? "#ff7b72" : entry.base_severity >= 5 ? "#d29922" : "#3fb950";

    /* compute per-domain raw contributions for this factor */
    const domContribs = DOMAINS
      .map(d => ({ d, val: rawScore * (entry.domain_weights[d] || 0) }))
      .filter(x => Math.abs(x.val) >= 0.05)
      .sort((a, b) => Math.abs(b.val) - Math.abs(a.val))
      .slice(0, 5);

    const chipHtml = domContribs.map(x => {
      const sign = x.val >= 0 ? "+" : "";
      return `<span class="dom-chip ${x.val >= 0 ? 'pos' : 'neg'}">${DOMAIN_LABELS[x.d]}: ${sign}${x.val.toFixed(2)}</span>`;
    }).join("");

    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="factor-id-cell">${f.factor_id}</td>
      <td><span class="${mit ? 'factor-kind-mit' : 'factor-kind-adv'}">${mit ? 'Mitigating' : 'Adverse'}</span></td>
      <td>
        <div class="sev-bar">
          <span style="font-variant-numeric:tabular-nums;font-family:monospace;color:${sevColor};min-width:14px">${entry.base_severity}</span>
          <div class="sev-track"><div class="sev-fill" style="width:${sevPct}%;background:${sevColor}"></div></div>
        </div>
      </td>
      <td><span class="conf-pill">${(f.confidence * 100).toFixed(0)}%</span></td>
      <td style="font-family:monospace;font-size:12px;color:${mit ? 'var(--accent2)' : 'var(--danger)'}">${mit ? '' : '+'}${rawScore.toFixed(2)}</td>
      <td><div class="dom-contrib-wrap">${chipHtml}</div></td>
    `;
    tbody.appendChild(tr);
  }
}

function buildPurposeTable(sc) {
  const table = document.getElementById("purposeTable");
  const purposeKeys = Object.keys(PURPOSE_PROFILES);
  const scores = purposeKeys.map(pk => ({ key: pk, val: PRECOMPUTED[sc.id][pk].composite }));
  scores.sort((a, b) => b.val - a.val);

  for (const s of scores) {
    const lv = level(s.val);
    const col = levelColor(lv);
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="purpose-name-cell">${s.key}</td>
      <td class="purpose-bar-cell">
        <div class="p-bar"><div class="p-bar-fill" style="width:${(s.val/10)*100}%;background:${col}"></div></div>
      </td>
      <td class="purpose-val-cell" style="color:${col}">${s.val.toFixed(1)}</td>
      <td style="padding-left:8px;width:70px">
        <span class="risk-badge" style="font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:${col}22;color:${col};border:1px solid ${col}44">${lv}</span>
      </td>
    `;
    table.appendChild(tr);
  }
}

/* =============================================================
   RADAR CHART
============================================================= */
function buildRadarChart(sc, result) {
  if (radarChart) { radarChart.destroy(); radarChart = null; }
  const ctx = document.getElementById("radarCanvas").getContext("2d");
  const vals   = DOMAINS.map(d => result.domNorm[d]);
  const labels = DOMAINS.map(d => DOMAIN_LABELS[d]);

  radarChart = new Chart(ctx, {
    type: "radar",
    data: {
      labels,
      datasets: [{
        label: sc.name,
        data: vals,
        borderColor: sc.color,
        backgroundColor: sc.color + "28",
        pointBackgroundColor: sc.color,
        pointBorderColor: "#0d1117",
        pointRadius: 4,
        borderWidth: 2,
        fill: true
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        r: {
          min: 0, max: 10,
          ticks: { stepSize: 2, color: "#8b949e", backdropColor: "transparent", font: { size: 10 } },
          grid:        { color: "rgba(48,54,61,0.8)" },
          angleLines:  { color: "rgba(48,54,61,0.8)" },
          pointLabels: { color: "#8b949e", font: { size: 11 } }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1c2128",
          borderColor: "#30363d",
          borderWidth: 1,
          titleColor: "#e6edf3",
          bodyColor: "#8b949e",
          callbacks: {
            label: ctx => ` ${ctx.parsed.r.toFixed(2)} [${level(ctx.parsed.r)}]`
          }
        }
      }
    }
  });
}

/* =============================================================
   BAR CHART — all 14 purpose profiles
============================================================= */
function buildBarChart(sc) {
  if (barChart) { barChart.destroy(); barChart = null; }
  const ctx = document.getElementById("barCanvas").getContext("2d");
  const purposeKeys = Object.keys(PURPOSE_PROFILES);
  const vals    = purposeKeys.map(pk => PRECOMPUTED[sc.id][pk].composite);
  const colors  = vals.map(v => levelColor(level(v)) + "cc");
  const borders = vals.map(v => levelColor(level(v)));

  /* pretty-print camel case labels */
  const prettyLabel = k => k.replace(/([A-Z])/g, ' $1').trim();

  barChart = new Chart(ctx, {
    type: "bar",
    data: {
      labels: purposeKeys.map(prettyLabel),
      datasets: [{
        data: vals,
        backgroundColor: colors,
        borderColor: borders,
        borderWidth: 1,
        borderRadius: 4
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      indexAxis: "y",
      scales: {
        x: {
          min: 0, max: 10,
          ticks: { color: "#8b949e", font: { size: 10 } },
          grid:  { color: "rgba(48,54,61,0.5)" }
        },
        y: {
          ticks: { color: "#8b949e", font: { size: 10 } },
          grid:  { color: "transparent" }
        }
      },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: "#1c2128",
          borderColor: "#30363d",
          borderWidth: 1,
          titleColor: "#e6edf3",
          bodyColor: "#8b949e",
          callbacks: {
            label: ctx => ` Composite: ${ctx.parsed.x.toFixed(1)}  [${level(ctx.parsed.x)}]`
          }
        }
      }
    }
  });
}

/* =============================================================
   INIT
============================================================= */
buildSidebar();
renderMain();
</script>
</body>
</html>
