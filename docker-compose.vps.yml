# ═══════════════════════════════════════════════════════
# VPS Deployment — Backend with built frontend
# Uses your existing system Caddy for HTTPS
#
# Usage:
#   docker compose -f docker-compose.vps.yml up --build -d
#
# Then point your system Caddy at localhost:${BACKEND_PORT:-8888}
# ═══════════════════════════════════════════════════════

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saptang-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8888}:${BACKEND_PORT:-8888}"
