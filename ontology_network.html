<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auracle v3 Risk Ontology — Network Graph</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg-base: #080b12;
    --bg-panel: #0d1118;
    --bg-panel-border: #1a2035;
    --bg-overlay: rgba(8, 11, 18, 0.92);
    --text-primary: #c8d4e8;
    --text-secondary: #6a7a96;
    --text-dim: #3a4a62;
    --accent-domain: #e8a030;
    --accent-domain-glow: rgba(232, 160, 48, 0.35);
    --accent-edge-pos: #e8a030;
    --accent-edge-neg: #30b8e8;
    --accent-edge-neg-glow: rgba(48, 184, 232, 0.35);

    --cat-identity:    #60a5fa;
    --cat-breach:      #a855f7;
    --cat-financial:   #f59e0b;
    --cat-criminal:    #f87171;
    --cat-screening:   #e879f9;
    --cat-litigation:  #2dd4bf;
    --cat-underground: #e05a7a;
    --cat-messaging:   #38bdf8;
    --cat-phone:       #fb923c;
    --cat-crosssource: #e2e8f0;
    --cat-corporate:   #f0b429;
    --cat-mitigating:  #4ade80;

    --cat-identity-glow:    rgba(96, 165, 250, 0.2);
    --cat-breach-glow:      rgba(168, 85, 247, 0.2);
    --cat-financial-glow:   rgba(245, 158, 11, 0.2);
    --cat-criminal-glow:    rgba(248, 113, 113, 0.2);
    --cat-screening-glow:   rgba(232, 121, 249, 0.2);
    --cat-litigation-glow:  rgba(45, 212, 191, 0.2);
    --cat-underground-glow: rgba(224, 90, 122, 0.35);
    --cat-messaging-glow:   rgba(56, 189, 248, 0.2);
    --cat-phone-glow:       rgba(251, 146, 60, 0.2);
    --cat-crosssource-glow: rgba(226, 232, 240, 0.15);
    --cat-corporate-glow:   rgba(240, 180, 41, 0.2);
    --cat-mitigating-glow:  rgba(74, 222, 128, 0.2);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: 'DM Sans', sans-serif;
    height: 100vh;
    overflow: hidden;
    cursor: default;
    user-select: none;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.07) 2px,
      rgba(0,0,0,0.07) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.5) 100%);
    pointer-events: none;
    z-index: 998;
  }

  #app {
    display: grid;
    grid-template-columns: 256px 1fr;
    grid-template-rows: 52px 1fr;
    height: 100vh;
    position: relative;
  }

  #header {
    grid-column: 1 / -1;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 0 20px;
    border-bottom: 1px solid var(--bg-panel-border);
    background: var(--bg-panel);
    position: relative;
    z-index: 10;
  }

  #header .logo-mark {
    width: 24px;
    height: 24px;
    border: 1.5px solid var(--accent-domain);
    border-radius: 50%;
    position: relative;
    flex-shrink: 0;
    animation: radar-sweep 4s linear infinite;
  }
  #header .logo-mark::after {
    content: '';
    position: absolute;
    inset: 3px;
    border-radius: 50%;
    border-top: 1.5px solid var(--accent-domain);
    opacity: 0.5;
  }
  @keyframes radar-sweep {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  #header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-primary);
  }
  #header h1 span { color: var(--accent-domain); }

  .header-meta {
    margin-left: auto;
    display: flex;
    gap: 20px;
    align-items: center;
  }
  .stat-pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-secondary);
    letter-spacing: 0.05em;
    padding: 3px 10px;
    border: 1px solid var(--bg-panel-border);
    border-radius: 2px;
  }
  .stat-pill strong {
    color: var(--accent-domain);
    font-weight: 600;
  }

  #sidebar {
    background: var(--bg-panel);
    border-right: 1px solid var(--bg-panel-border);
    padding: 14px;
    overflow-y: auto;
    overflow-x: hidden;
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #sidebar::-webkit-scrollbar { width: 3px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--bg-panel-border); border-radius: 2px; }

  .panel-section {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .panel-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.15em;
    color: var(--text-dim);
    text-transform: uppercase;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--bg-panel-border);
  }

  .cat-item {
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
    padding: 2px 0;
    transition: opacity 0.15s;
  }
  .cat-item:hover { opacity: 0.8; }
  .cat-item input[type="checkbox"] { display: none; }
  .cat-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .cat-item:hover .cat-dot { transform: scale(1.4); }
  .cat-item input:checked ~ .cat-dot { box-shadow: 0 0 6px 2px currentColor; }
  .cat-name {
    font-size: 11px;
    color: var(--text-secondary);
    flex: 1;
  }
  .cat-count {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
  }

  .slider-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .slider-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .slider-label {
    font-size: 11px;
    color: var(--text-secondary);
  }
  #severity-val, #weight-val {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--accent-domain);
    font-weight: 600;
  }

  input[type="range"] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 2px;
    background: linear-gradient(to right, var(--accent-domain) var(--fill, 0%), var(--bg-panel-border) var(--fill, 0%));
    border-radius: 2px;
    outline: none;
    cursor: pointer;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--accent-domain);
    box-shadow: 0 0 8px var(--accent-domain-glow);
    cursor: pointer;
    transition: transform 0.1s;
  }
  input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.3); }

  .toggle-row {
    display: flex;
    gap: 6px;
  }
  .edge-toggle {
    flex: 1;
    padding: 6px 4px;
    font-size: 10px;
    font-family: 'IBM Plex Mono', monospace;
    letter-spacing: 0.04em;
    text-align: center;
    border: 1px solid var(--bg-panel-border);
    border-radius: 2px;
    cursor: pointer;
    background: transparent;
    color: var(--text-secondary);
    transition: all 0.15s;
  }
  .edge-toggle.active {
    border-color: var(--accent-domain);
    color: var(--accent-domain);
    background: rgba(232, 160, 48, 0.08);
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 2px 0;
  }
  .legend-shape {
    flex-shrink: 0;
    width: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .legend-text {
    font-size: 10px;
    color: var(--text-secondary);
    line-height: 1.4;
  }

  #reset-btn {
    width: 100%;
    padding: 8px;
    background: transparent;
    border: 1px solid var(--bg-panel-border);
    color: var(--text-secondary);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    border-radius: 2px;
    transition: all 0.15s;
  }
  #reset-btn:hover {
    border-color: var(--accent-domain);
    color: var(--accent-domain);
    background: rgba(232, 160, 48, 0.06);
  }

  #canvas-wrap {
    position: relative;
    overflow: hidden;
  }

  #graph-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .domain-ring {
    fill: none;
    stroke-width: 1;
    opacity: 0.3;
    animation: ring-pulse 3s ease-in-out infinite;
  }
  @keyframes ring-pulse {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 0.1; }
  }

  .node-domain circle.core {
    stroke-width: 1.5;
    filter: url(#domain-glow);
    cursor: pointer;
    transition: all 0.2s;
  }
  .node-domain circle.core:hover { filter: url(#domain-glow-intense); }
  .node-domain.highlighted circle.core {
    stroke-width: 2.5;
    filter: url(#domain-glow-intense);
  }
  .node-domain.dimmed { opacity: 0.15; }

  .node-factor circle {
    stroke-width: 1;
    cursor: pointer;
    transition: all 0.2s;
  }
  .node-factor.dimmed {
    opacity: 0.04;
    pointer-events: none;
  }
  .node-factor.highlighted circle {
    stroke-width: 2;
    filter: url(#factor-glow);
  }

  .link {
    fill: none;
    transition: opacity 0.2s;
  }
  .link.dimmed { opacity: 0.02 !important; }
  .link.highlighted { opacity: 1 !important; }

  .domain-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.06em;
    fill: var(--accent-domain);
    text-anchor: middle;
    pointer-events: none;
    dominant-baseline: central;
  }
  .factor-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 7.5px;
    fill: var(--text-secondary);
    pointer-events: none;
    dominant-baseline: central;
  }

  #tooltip {
    position: fixed;
    background: var(--bg-panel);
    border: 1px solid var(--bg-panel-border);
    border-radius: 3px;
    padding: 14px 16px;
    max-width: 300px;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 100;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }
  #tooltip.visible { opacity: 1; }

  .tt-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 6px;
    letter-spacing: 0.04em;
  }
  .tt-cat {
    font-size: 10px;
    color: var(--text-secondary);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .tt-severity-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .tt-bar-bg {
    flex: 1;
    height: 3px;
    background: var(--bg-panel-border);
    border-radius: 2px;
    overflow: hidden;
  }
  .tt-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s;
  }
  .tt-sev-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--accent-domain);
    white-space: nowrap;
  }
  .tt-domains {
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 8px;
  }
  .tt-domain-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    gap: 8px;
  }
  .tt-domain-name { color: var(--text-secondary); flex: 1; }
  .tt-domain-wt {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    white-space: nowrap;
  }
  .tt-domain-wt.pos { color: #f59e0b; }
  .tt-domain-wt.neg { color: #30b8e8; }
  .tt-domain-wt.zero { color: var(--text-dim); }

  .tt-divider {
    border: none;
    border-top: 1px solid var(--bg-panel-border);
    margin: 8px 0;
  }
  .tt-type-domain {
    font-size: 10px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
</style>
</head>
<body>
<div id="app">
  <header id="header">
    <div class="logo-mark"></div>
    <h1>AURACLE <span>v3</span> — RISK ONTOLOGY NETWORK</h1>
    <div class="header-meta">
      <div class="stat-pill"><strong>109</strong> FACTORS</div>
      <div class="stat-pill"><strong>10</strong> DOMAINS</div>
      <div class="stat-pill"><strong>12</strong> CATEGORIES</div>
    </div>
  </header>

  <aside id="sidebar">
    <div class="panel-section">
      <div class="panel-label">Filter by Category</div>
      <label class="cat-item" data-cat="Identity">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#60a5fa; color:#60a5fa;"></span>
        <span class="cat-name">Identity</span>
        <span class="cat-count">6</span>
      </label>
      <label class="cat-item" data-cat="Breach/Cyber">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#a855f7; color:#a855f7;"></span>
        <span class="cat-name">Breach / Cyber</span>
        <span class="cat-count">12</span>
      </label>
      <label class="cat-item" data-cat="Financial">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#f59e0b; color:#f59e0b;"></span>
        <span class="cat-name">Financial</span>
        <span class="cat-count">12</span>
      </label>
      <label class="cat-item" data-cat="Criminal">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#f87171; color:#f87171;"></span>
        <span class="cat-name">Criminal</span>
        <span class="cat-count">9</span>
      </label>
      <label class="cat-item" data-cat="Screening">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#e879f9; color:#e879f9;"></span>
        <span class="cat-name">Screening</span>
        <span class="cat-count">7</span>
      </label>
      <label class="cat-item" data-cat="Litigation/CourtRecords">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#2dd4bf; color:#2dd4bf;"></span>
        <span class="cat-name">Litigation / Court Records</span>
        <span class="cat-count">25</span>
      </label>
      <label class="cat-item" data-cat="Underground">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#e05a7a; color:#e05a7a;"></span>
        <span class="cat-name">Underground</span>
        <span class="cat-count">12</span>
      </label>
      <label class="cat-item" data-cat="Messaging">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#38bdf8; color:#38bdf8;"></span>
        <span class="cat-name">Messaging</span>
        <span class="cat-count">2</span>
      </label>
      <label class="cat-item" data-cat="Phone">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#fb923c; color:#fb923c;"></span>
        <span class="cat-name">Phone</span>
        <span class="cat-count">1</span>
      </label>
      <label class="cat-item" data-cat="CrossSource">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#e2e8f0; color:#e2e8f0;"></span>
        <span class="cat-name">Cross-Source</span>
        <span class="cat-count">1</span>
      </label>
      <label class="cat-item" data-cat="Corporate">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#f0b429; color:#f0b429;"></span>
        <span class="cat-name">Corporate</span>
        <span class="cat-count">10</span>
      </label>
      <label class="cat-item" data-cat="Mitigating">
        <input type="checkbox" checked>
        <span class="cat-dot" style="background:#4ade80; color:#4ade80;"></span>
        <span class="cat-name">Mitigating</span>
        <span class="cat-count">12</span>
      </label>
    </div>

    <div class="panel-section">
      <div class="panel-label">Min Severity</div>
      <div class="slider-row">
        <div class="slider-header">
          <span class="slider-label">Show factors ≥</span>
          <span id="severity-val">1</span>
        </div>
        <input type="range" id="severity-slider" min="1" max="10" value="1" step="1">
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Min |Edge Weight|</div>
      <div class="slider-row">
        <div class="slider-header">
          <span class="slider-label">Show edges ≥</span>
          <span id="weight-val">0.0</span>
        </div>
        <input type="range" id="weight-slider" min="0" max="25" value="0" step="1">
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Edge Type</div>
      <div class="toggle-row">
        <button class="edge-toggle active" data-edge="positive">Positive</button>
        <button class="edge-toggle active" data-edge="negative">Negative</button>
      </div>
    </div>

    <div class="panel-section">
      <div class="panel-label">Legend</div>
      <div class="legend-item">
        <div class="legend-shape">
          <svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="none" stroke="#e8a030" stroke-width="1.5"/><circle cx="9" cy="9" r="4" fill="#e8a030" opacity="0.4"/></svg>
        </div>
        <span class="legend-text">Domain node (size = influence)</span>
      </div>
      <div class="legend-item">
        <div class="legend-shape">
          <svg width="18" height="18"><circle cx="9" cy="9" r="5" fill="#60a5fa" opacity="0.7"/></svg>
        </div>
        <span class="legend-text">Factor node (size = severity)</span>
      </div>
      <div class="legend-item">
        <div class="legend-shape">
          <svg width="18" height="4"><line x1="0" y1="2" x2="18" y2="2" stroke="#e8a030" stroke-width="2"/></svg>
        </div>
        <span class="legend-text">Positive weight edge</span>
      </div>
      <div class="legend-item">
        <div class="legend-shape">
          <svg width="18" height="4"><line x1="0" y1="2" x2="18" y2="2" stroke="#30b8e8" stroke-width="1.5" stroke-dasharray="3,2"/></svg>
        </div>
        <span class="legend-text">Negative weight edge</span>
      </div>
    </div>

    <button id="reset-btn">Reset View</button>
  </aside>

  <div id="canvas-wrap">
    <svg id="graph-svg"></svg>
  </div>
</div>

<div id="tooltip"></div>

<script>
// ── FACTOR CATALOG (109 factors, verbatim from risk_scorer.py) ─────────────

  "AliasIdentity": {

  "UnreportedSecondaryMobile": {

    domain_weights: { CreditRisk: 0.3, ComplianceRisk: 0.6, CriminalRisk: 0.3, NarcoTerrorNexusRisk: 0.5, BenamiRisk: 0.5, PoliticalExposureRisk: 0.3, MatrimonialRisk: 0.8, EmploymentBGVRisk: 0.5, ReputationalRisk: 0.2, CyberAccountTakeoverRisk: 0.0 }
  },
  "AddressInconsistency": {

  // Breach/Cyber

  "Identity":               "#60a5fa",

// ── BUILD GRAPH DATA ─────────────────────────────────────────────────────────
function buildGraph() {
  const nodes = [];
  const links = [];
  const nodeById = {};

  // Domain nodes
  DOMAINS.forEach(d => {
    // compute total absolute weight incoming from all factors
    let totalWt = 0;
    Object.values(FACTOR_CATALOG).forEach(f => {
      totalWt += Math.abs(f.domain_weights[d.id] || 0);
    });
    const n = {
      id: d.id,
      label: d.label,
      type: "domain",
      totalWeight: totalWt,
      r: 20 + Math.sqrt(totalWt) * 1.8,
    };
    nodes.push(n);
    nodeById[d.id] = n;
  });

  // Factor nodes
  Object.entries(FACTOR_CATALOG).forEach(([fid, fdata]) => {
    const n = {
      id: fid,
      label: fid,
      type: "factor",
      category: fdata.category,
      base_severity: fdata.base_severity,
      domain_weights: fdata.domain_weights,
      r: 4 + fdata.base_severity * 0.85,
      color: CATEGORY_COLORS[fdata.category] || "#e2e8f0",
    };
    nodes.push(n);
    nodeById[fid] = n;
  });

  // Edges: factor → domain where weight != 0
  Object.entries(FACTOR_CATALOG).forEach(([fid, fdata]) => {
    DOMAINS.forEach(d => {
      const w = fdata.domain_weights[d.id] || 0;
      if (w !== 0) {
        links.push({
          source: fid,
          target: d.id,
          weight: w,
          absWeight: Math.abs(w),
          isNegative: w < 0,
        });
      }
    });
  });

  return { nodes, links, nodeById };
}

// ── STATE ────────────────────────────────────────────────────────────────────
let state = {
  activeCategories: new Set(Object.keys(CATEGORY_COLORS)),
  minSeverity: 1,
  minWeight: 0,
  showPositive: true,
  showNegative: true,
  hoveredNode: null,
};

// ── MAIN ─────────────────────────────────────────────────────────────────────
const { nodes, links } = buildGraph();

const svg = d3.select("#graph-svg");
const wrap = document.getElementById("canvas-wrap");
const tooltip = document.getElementById("tooltip");

// SVG defs (filters)
const defs = svg.append("defs");

[
  { id: "domain-glow", color: "#e8a030", blur: 8, opacity: 0.7 },
  { id: "domain-glow-intense", color: "#e8a030", blur: 16, opacity: 1.0 },
  { id: "factor-glow", color: "#ffffff", blur: 6, opacity: 0.6 },
].forEach(({ id, color, blur, opacity }) => {
  const f = defs.append("filter").attr("id", id).attr("x", "-50%").attr("y", "-50%").attr("width", "200%").attr("height", "200%");
  f.append("feGaussianBlur").attr("stdDeviation", blur / 2).attr("result", "blur");
  const merge = f.append("feMerge");
  merge.append("feMergeNode").attr("in", "blur");
  merge.append("feMergeNode").attr("in", "SourceGraphic");
});

const g = svg.append("g").attr("class", "graph-root");

// Zoom
const zoom = d3.zoom()
  .scaleExtent([0.08, 4])
  .on("zoom", (event) => g.attr("transform", event.transform));
svg.call(zoom);

let linkSel, domainSel, factorSel;

function getWidth() { return wrap.clientWidth; }
function getHeight() { return wrap.clientHeight; }

// ── FORCE SIMULATION ─────────────────────────────────────────────────────────
const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
    if (d.target.type === "domain") return 110 + (d.source.base_severity || 5) * 4;
    return 80;
  }).strength(0.15))
  .force("charge", d3.forceManyBody().strength(d => d.type === "domain" ? -900 : -55))
  .force("center", d3.forceCenter(getWidth() / 2, getHeight() / 2))
  .force("collide", d3.forceCollide().radius(d => d.r + 3).strength(0.7))
  .force("x", d3.forceX(getWidth() / 2).strength(0.02))
  .force("y", d3.forceY(getHeight() / 2).strength(0.02))
  .alphaDecay(0.018)
  .velocityDecay(0.45);

// ── RENDER ───────────────────────────────────────────────────────────────────
function isFactorVisible(f) {
  return state.activeCategories.has(f.category) && f.base_severity >= state.minSeverity;
}

function isLinkVisible(l) {
  const src = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
  if (!src || src.type !== "factor") return false;
  if (!isFactorVisible(src)) return false;
  if (l.absWeight < state.minWeight) return false;
  if (l.isNegative && !state.showNegative) return false;
  if (!l.isNegative && !state.showPositive) return false;
  return true;
}

function render() {
  // Links
  linkSel = g.selectAll(".link")
    .data(links, d => `${d.source.id || d.source}-${d.target.id || d.target}`)
    .join("line")
    .attr("class", "link")
    .attr("stroke", d => d.isNegative ? "#30b8e8" : "#e8a030")
    .attr("stroke-dasharray", d => d.isNegative ? "5,3" : null)
    .attr("opacity", d => isLinkVisible(d) ? (d.isNegative ? 0.35 : 0.28) : 0.0)
    .attr("stroke-width", d => 0.4 + d.absWeight * 0.6);

  // Domain nodes
  domainSel = g.selectAll(".node-domain")
    .data(nodes.filter(d => d.type === "domain"), d => d.id)
    .join(enter => {
      const grp = enter.append("g").attr("class", "node-domain").call(drag());
      grp.append("circle").attr("class", "ring domain-ring").attr("stroke", "#e8a030");
      grp.append("circle").attr("class", "core");
      grp.append("text").attr("class", "domain-label");
      return grp;
    });

  domainSel.select("circle.ring").attr("r", d => d.r + 10);
  domainSel.select("circle.core")
    .attr("r", d => d.r)
    .attr("fill", "rgba(232,160,48,0.08)")
    .attr("stroke", "#e8a030");
  domainSel.select("text.domain-label").text(d => d.label);

  domainSel.on("mouseover", (event, d) => {
      state.hoveredNode = d;
      updateHighlight();
      showDomainTooltip(event, d);
    })
    .on("mousemove", moveTooltip)
    .on("mouseout", () => {
      state.hoveredNode = null;
      updateHighlight();
      hideTooltip();
    });

  // Factor nodes
  factorSel = g.selectAll(".node-factor")
    .data(nodes.filter(d => d.type === "factor"), d => d.id)
    .join(enter => {
      const grp = enter.append("g").attr("class", "node-factor").call(drag());
      grp.append("circle");
      grp.append("text").attr("class", "factor-label");
      return grp;
    });

  factorSel.select("circle")
    .attr("r", d => d.r)
    .attr("fill", d => hexToRgba(d.color, 0.18))
    .attr("stroke", d => d.color);

  factorSel.select("text.factor-label")
    .text(d => d.label.length > 22 ? d.label.slice(0, 20) + "…" : d.label)
    .attr("x", d => d.r + 3)
    .attr("y", 0);

  factorSel
    .attr("display", d => isFactorVisible(d) ? null : "none")
    .on("mouseover", (event, d) => {
      state.hoveredNode = d;
      updateHighlight();
      showFactorTooltip(event, d);
    })
    .on("mousemove", moveTooltip)
    .on("mouseout", () => {
      state.hoveredNode = null;
      updateHighlight();
      hideTooltip();
    });

  sim.on("tick", ticked);
}

function ticked() {
  if (!linkSel) return;
  linkSel
    .attr("x1", d => (typeof d.source === "object" ? d.source : {x:0}).x)
    .attr("y1", d => (typeof d.source === "object" ? d.source : {x:0}).y)
    .attr("x2", d => (typeof d.target === "object" ? d.target : {x:0}).x)
    .attr("y2", d => (typeof d.target === "object" ? d.target : {x:0}).y);

  domainSel.attr("transform", d => `translate(${d.x},${d.y})`);
  factorSel.attr("transform", d => `translate(${d.x},${d.y})`);
}

function updateVisibility() {
  if (!linkSel) return;
  linkSel
    .attr("opacity", d => isLinkVisible(d) ? (d.isNegative ? 0.35 : 0.28) : 0.0)
    .attr("stroke-width", d => 0.4 + d.absWeight * 0.6);

  factorSel.attr("display", d => isFactorVisible(d) ? null : "none");
  updateHighlight();
}

function updateHighlight() {
  const hov = state.hoveredNode;
  if (!hov) {
    domainSel.classed("highlighted", false).classed("dimmed", false);
    factorSel.classed("highlighted", false).classed("dimmed", false);
    linkSel.classed("highlighted", false).classed("dimmed", false);
    linkSel.attr("opacity", d => isLinkVisible(d) ? (d.isNegative ? 0.35 : 0.28) : 0.0);
    return;
  }

  if (hov.type === "domain") {
    const connectedFactors = new Set();
    links.forEach(l => {
      const tgt = typeof l.target === "object" ? l.target : nodes.find(n => n.id === l.target);
      if (tgt && tgt.id === hov.id) {
        const src = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
        if (src) connectedFactors.add(src.id);
      }
    });
    domainSel
      .classed("highlighted", d => d.id === hov.id)
      .classed("dimmed", d => d.id !== hov.id);
    factorSel
      .classed("highlighted", d => connectedFactors.has(d.id))
      .classed("dimmed", d => !connectedFactors.has(d.id));
    linkSel
      .classed("highlighted", l => {
        const tgt = typeof l.target === "object" ? l.target : nodes.find(n => n.id === l.target);
        return tgt && tgt.id === hov.id && isLinkVisible(l);
      })
      .classed("dimmed", l => {
        const tgt = typeof l.target === "object" ? l.target : nodes.find(n => n.id === l.target);
        return !(tgt && tgt.id === hov.id);
      })
      .attr("opacity", l => {
        const tgt = typeof l.target === "object" ? l.target : nodes.find(n => n.id === l.target);
        if (tgt && tgt.id === hov.id && isLinkVisible(l)) return l.isNegative ? 0.9 : 0.85;
        return 0.02;
      });
  } else {
    const connectedDomains = new Set();
    links.forEach(l => {
      const src = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
      if (src && src.id === hov.id) {
        const tgt = typeof l.target === "object" ? l.target : nodes.find(n => n.id === l.target);
        if (tgt) connectedDomains.add(tgt.id);
      }
    });
    domainSel
      .classed("highlighted", d => connectedDomains.has(d.id))
      .classed("dimmed", d => !connectedDomains.has(d.id));
    factorSel
      .classed("highlighted", d => d.id === hov.id)
      .classed("dimmed", d => d.id !== hov.id);
    linkSel
      .classed("highlighted", l => {
        const src = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
        return src && src.id === hov.id && isLinkVisible(l);
      })
      .classed("dimmed", l => {
        const src = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
        return !(src && src.id === hov.id);
      })
      .attr("opacity", l => {
        const src = typeof l.source === "object" ? l.source : nodes.find(n => n.id === l.source);
        if (src && src.id === hov.id && isLinkVisible(l)) return l.isNegative ? 0.9 : 0.85;
        return 0.02;
      });
  }
}

// ── DRAG ─────────────────────────────────────────────────────────────────────
function drag() {
  return d3.drag()
    .on("start", (event, d) => {
      if (!event.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (event, d) => { d.fx = event.x; d.fy = event.y; })
    .on("end", (event, d) => {
      if (!event.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
}

// ── TOOLTIPS ─────────────────────────────────────────────────────────────────
function showFactorTooltip(event, d) {
  const sevPct = (d.base_severity / 10) * 100;
  const color = d.color;
  const domainRows = DOMAINS
    .map(dom => {
      const w = d.domain_weights[dom.id] || 0;
      if (w === 0) return null;
      const cls = w > 0 ? "pos" : w < 0 ? "neg" : "zero";
      const sign = w > 0 ? "+" : "";
      return `<div class="tt-domain-row"><span class="tt-domain-name">${dom.label}</span><span class="tt-domain-wt ${cls}">${sign}${w.toFixed(1)}</span></div>`;
    })
    .filter(Boolean)
    .join("");

  tooltip.innerHTML = `
    <div class="tt-name">${d.id}</div>
    <div class="tt-cat" style="color:${color}">${d.category}</div>
    <div class="tt-severity-bar">
      <span class="slider-label" style="font-size:10px;color:var(--text-dim)">SEV</span>
      <div class="tt-bar-bg"><div class="tt-bar-fill" style="width:${sevPct}%;background:${color}"></div></div>
      <span class="tt-sev-label">${d.base_severity}/10</span>
    </div>
    <hr class="tt-divider">
    <div class="tt-domains">${domainRows}</div>`;
  tooltip.classList.add("visible");
  positionTooltip(event);
}

function showDomainTooltip(event, d) {
  const factorCount = links.filter(l => {
    const tgt = typeof l.target === "object" ? l.target.id : l.target;
    return tgt === d.id;
  }).length;

  tooltip.innerHTML = `
    <div class="tt-name">${d.label.toUpperCase()} RISK</div>
    <div class="tt-cat" style="color:#e8a030">Domain Node</div>
    <hr class="tt-divider">
    <div class="tt-type-domain">
      <strong style="color:var(--text-primary)">${factorCount}</strong> factor edges<br>
      Combined weight: <strong style="color:#e8a030">${d.totalWeight.toFixed(1)}</strong>
    </div>`;
  tooltip.classList.add("visible");
  positionTooltip(event);
}

function positionTooltip(event) {
  const tw = tooltip.offsetWidth || 290;
  const th = tooltip.offsetHeight || 200;
  let x = event.clientX + 16;
  let y = event.clientY - 10;
  if (x + tw > window.innerWidth - 10) x = event.clientX - tw - 16;
  if (y + th > window.innerHeight - 10) y = window.innerHeight - th - 10;
  tooltip.style.left = x + "px";
  tooltip.style.top = y + "px";
}

function moveTooltip(event) {
  if (tooltip.classList.contains("visible")) positionTooltip(event);
}

function hideTooltip() {
  tooltip.classList.remove("visible");
}

// ── CONTROLS ─────────────────────────────────────────────────────────────────
// Category checkboxes
document.querySelectorAll(".cat-item").forEach(item => {
  const cb = item.querySelector("input[type='checkbox']");
  const cat = item.dataset.cat;
  cb.addEventListener("change", () => {
    if (cb.checked) state.activeCategories.add(cat);
    else state.activeCategories.delete(cat);
    updateVisibility();
    sim.alpha(0.1).restart();
  });
});

// Severity slider
const sevSlider = document.getElementById("severity-slider");
const sevVal = document.getElementById("severity-val");
sevSlider.addEventListener("input", () => {
  state.minSeverity = +sevSlider.value;
  sevVal.textContent = sevSlider.value;
  const pct = ((+sevSlider.value - 1) / 9 * 100).toFixed(0);
  sevSlider.style.setProperty("--fill", pct + "%");
  updateVisibility();
  sim.alpha(0.1).restart();
});

// Weight slider
const wtSlider = document.getElementById("weight-slider");
const wtVal = document.getElementById("weight-val");
wtSlider.addEventListener("input", () => {
  state.minWeight = +wtSlider.value / 10;
  wtVal.textContent = state.minWeight.toFixed(1);
  const pct = (+wtSlider.value / 25 * 100).toFixed(0);
  wtSlider.style.setProperty("--fill", pct + "%");
  updateVisibility();
});

// Edge type toggles
document.querySelectorAll(".edge-toggle").forEach(btn => {
  btn.addEventListener("click", () => {
    btn.classList.toggle("active");
    const type = btn.dataset.edge;
    if (type === "positive") state.showPositive = btn.classList.contains("active");
    else state.showNegative = btn.classList.contains("active");
    updateVisibility();
  });
});

// Reset
document.getElementById("reset-btn").addEventListener("click", () => {
  svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(0, 0).scale(1));
  sim.alpha(0.4).restart();
});

// ── UTILS ────────────────────────────────────────────────────────────────────
function hexToRgba(hex, alpha) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${alpha})`;
}

// ── INIT ─────────────────────────────────────────────────────────────────────
render();

// Initial zoom-to-fit after simulation settles
sim.on("end", () => {
  const w = getWidth(), h = getHeight();
  svg.transition().duration(800).call(
    zoom.transform,
    d3.zoomIdentity.translate(w * 0.5, h * 0.5).scale(0.55).translate(-w * 0.5, -h * 0.5)
  );
});

// Resize
window.addEventListener("resize", () => {
  sim.force("center", d3.forceCenter(getWidth() / 2, getHeight() / 2));
  sim.force("x", d3.forceX(getWidth() / 2).strength(0.02));
  sim.force("y", d3.forceY(getHeight() / 2).strength(0.02));
  sim.alpha(0.1).restart();
});
</script>
</body>
</html>
